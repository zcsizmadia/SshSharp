name: Publish

# Publishes the packages to nuget.org when a version tag is pushed (v0.1.0, v1.0.0-preview.1, ...); MinVer turns the tag into the
# package version. Authentication is NuGet trusted publishing: GitHub's OIDC token is exchanged for a short-lived API key, so no key
# is stored anywhere. The nuget.org policy must name this repository and this workflow file (publish.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

# Actions are pinned by commit SHA (the tag in the comment is for humans and Dependabot).
jobs:
  publish:
    name: publish (nuget.org)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer reads the version from the tag
      - name: The tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; only commits on main are published."
            exit 1
          fi
      - uses: ./.github/actions/setup-dotnet
        with:
          cache: false
          build: true
      - name: Test net8.0
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net8.0 --no-build
      - name: Test net10.0
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build
      - name: Pack
        run: |
          set -euo pipefail
          dotnet pack src/SshSharp -c Release --no-build -o packages
          dotnet pack src/SshSharp.FileProviders -c Release --no-build -o packages
          dotnet pack src/SshSharp.IO.Abstractions -c Release --no-build -o packages
          dotnet pack src/SshSharp.Extensions.DependencyInjection -c Release --no-build -o packages
          version="${GITHUB_REF_NAME#v}"
          for id in SshSharp SshSharp.FileProviders SshSharp.IO.Abstractions SshSharp.Extensions.DependencyInjection; do
            if [ ! -f "packages/$id.$version.nupkg" ]; then
              echo "::error::Expected packages/$id.$version.nupkg for tag $GITHUB_REF_NAME; got: $(ls packages)"
              exit 1
            fi
          done
          ls packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/*
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: zcsizmadia
      - name: Push to nuget.org
        # The .snupkg symbol packages next to each .nupkg are pushed with it.
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
