name: Mutation testing

# Stryker.NET mutates the library and runs the TUnit suite against every mutant: a mutant no test notices is a gap in the tests.
# The weekly run is incremental: it mutates only what changed in the last eight days. A manual run is full by default; a full run takes
# hours on the hosted runners, so the large files run as jobs of their own, and each job compiles only the tests for its files.
# Reports are uploaded as artifacts; the score is not a gate.
on:
  schedule:
    - cron: '17 3 * * 6' # weekly
  workflow_dispatch:
    inputs:
      full:
        description: Mutate everything, not only what changed in the last eight days
        type: boolean
        default: true

permissions:
  contents: read

# Actions are pinned by commit SHA (the tag in the comment is for humans and Dependabot).
jobs:
  mutation:
    name: mutation (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: field25519
            mutate: -m "**/Crypto/Field25519.cs"
            tests: Crypto/Field25519Tests.cs;Crypto/X25519Tests.cs;Crypto/Ed25519Tests.cs;Crypto/WycheproofTests.cs
          - scope: x25519
            mutate: -m "**/Crypto/X25519.cs"
            tests: Crypto/X25519Tests.cs;Crypto/WycheproofTests.cs;Protocol/ClientKeyExchangeTests.cs
          - scope: ed25519
            mutate: -m "**/Crypto/Ed25519.cs"
            tests: Crypto/Ed25519Tests.cs;Crypto/WycheproofTests.cs;Keys/*Tests.cs
          # ChaCha20*.cs: the scalar ChaCha20.cs, the vectorized ChaCha20.Vector.cs and ChaCha20Poly1305OpenSsh.cs. Poly1305*.cs: the
          # 64-bit Poly1305.cs and the 26-bit Poly1305.Limbs26.cs.
          - scope: chacha20-poly1305
            mutate: -m "**/Crypto/ChaCha20*.cs" -m "**/Crypto/Poly1305*.cs"
            tests: Crypto/ChaChaPolyTests.cs;Crypto/ChaCha20VectorTests.cs;Crypto/Poly1305Tests.cs;Crypto/WycheproofTests.cs;Protocol/PacketCodecTests.cs
          - scope: aes-ctr
            mutate: -m "**/Crypto/AesCtr.cs" -m "**/Crypto/XorHelper.cs"
            tests: Crypto/AesCtrTests.cs;Crypto/ChaChaPolyTests.cs;Protocol/PacketCodecTests.cs
          - scope: argon2-blake2b
            mutate: -m "**/Crypto/Argon2.cs" -m "**/Crypto/Blake2b.cs"
            tests: Crypto/Argon2Tests.cs;Keys/*Tests.cs
          - scope: key-writers
            mutate: -m "**/Keys/Pkcs8KeyWriter.cs" -m "**/Keys/PuttyKeyWriter.cs"
            tests: Keys/*Tests.cs
          - scope: bcrypt-pbkdf
            mutate: -m "**/Crypto/BcryptPbkdf.cs"
            tests: Crypto/BcryptPbkdfTests.cs;Keys/*Tests.cs
          # Reading private key files: the parser, the OpenSSH key decryptor (bcrypt_pbkdf with AES or chacha20-poly1305) and the
          # traditional encrypted PEM decryptor (EVP_BytesToKey with AES-CBC).
          - scope: key-readers
            mutate: -m "**/Keys/PrivateKeyParser.cs" -m "**/Keys/OpenSshKeyDecryptor.cs" -m "**/Keys/LegacyPemKeyDecryptor.cs"
            tests: Keys/*Tests.cs;Fuzz/ParserRobustnessTests.cs;Fuzz/EncryptedKeyRobustnessTests.cs
          - scope: ecdh-dh
            mutate: -m "**/Crypto/NistCurve.cs" -m "**/Crypto/ModpGroup.cs" -m "**/Crypto/DhGroupValidator.cs" -m "**/Protocol/ClientKeyExchange.cs" -m "**/Protocol/DhGroupExchangeKeyExchange.cs"
            tests: Crypto/NistCurveTests.cs;Crypto/ModpGroupTests.cs;Crypto/DhGroupValidatorTests.cs;Crypto/WycheproofTests.cs;Protocol/ClientKeyExchangeTests.cs;Protocol/DhGroupExchangeTests.cs;Protocol/MlKemKexTests.cs;Protocol/SntrupKexTests.cs;Keys/ExternalKeyTests.cs;Agent/AgentTests.cs
          - scope: public-key
            mutate: -m "**/Keys/SshPublicKey.cs" -m "**/Keys/VerifyingKey.cs"
            tests: Keys/*Tests.cs;Crypto/WycheproofTests.cs;Fuzz/ParserRobustnessTests.cs
          - scope: certificates
            mutate: -m "**/SshCertificate.cs" -m "**/SshCertificateBuilder.cs"
            tests: CertificateTests.cs;Keys/SshCertificate*Tests.cs;Keys/SshKeyRevocationListTests.cs;Keys/ExternalKeyTests.cs;Keys/SshSignatureTests.cs;KnownHostsVerifierTests.cs;Fuzz/ParserRobustnessTests.cs
          - scope: signatures
            mutate: -m "**/Keys/SshSignature.cs" -m "**/Keys/SshAllowedSigners.cs"
            tests: Keys/SshSignatureTests.cs;Keys/ExternalKeyTests.cs;Fuzz/ParserRobustnessTests.cs
          - scope: krl
            mutate: -m "**/Config/RevokedKeyList.cs" -m "**/Keys/SshKeyRevocationList.cs"
            tests: Keys/SshKeyRevocationListTests.cs;Config/RevokedHostKeysTests.cs;Fuzz/ParserRobustnessTests.cs
          - scope: agent-server
            mutate: -m "**/Protocol/AgentServer.cs"
            tests: Agent/AgentServerTests.cs;Agent/InProcessAgentTests.cs
          - scope: sntrup761
            mutate: -m "**/Crypto/Sntrup761.cs"
            tests: Crypto/Sntrup761Tests.cs;Protocol/SntrupKexTests.cs
          - scope: packet-codec
            mutate: -m "**/Protocol/PacketCodec.cs" -m "**/Protocol/PacketProtector*.cs"
            tests: Protocol/PacketCodecTests.cs;Protocol/KexNegotiationTests.cs;Protocol/SshWireTests.cs;Fuzz/ParserRobustnessTests.cs
          # zlib@openssh.com: the bounded inflater of what the server sends, and the Huffman-only compressor.
          - scope: packet-compression
            mutate: -m "**/Protocol/PacketCompression.cs"
            tests: Protocol/PacketCompressionTests.cs;Protocol/SshTransportCompressionTests.cs;CompressionTests.cs;Fuzz/ParserRobustnessTests.cs
          - scope: userauth
            mutate: -m "**/Protocol/SshUserAuth.cs"
            tests: KeyboardInteractiveTests.cs;PasswordAuthenticationTests.cs;PublicKeyAuthTests.cs;PubkeyAcceptedAlgorithmsTests.cs;Agent/AgentServerTests.cs;Protocol/GssapiTests.cs
          - scope: identification
            mutate: -m "**/Protocol/SshIdentification.cs"
            tests: Protocol/SshIdentificationTests.cs;ConnectionOptionsTests.cs
          - scope: config-parser
            mutate: -m "**/Config/SshConfig.cs" -m "**/Config/SshConfigLine.cs"
            tests: Config/*Tests.cs;Fuzz/ParserRobustnessTests.cs;ConfigConnectTests.cs;ConfigForwardingTests.cs;KeyboardInteractiveTests.cs;ObscureKeystrokeTimingTests.cs;Agent/AgentKeyManagementTests.cs;CompressionTests.cs
          - scope: config-tokens-glob
            mutate: -m "**/Config/SshTokens.cs" -m "**/Config/Glob.cs"
            tests: Config/*Tests.cs;Fuzz/ParserRobustnessTests.cs;ConfigConnectTests.cs
          - scope: sftp-glob
            mutate: -m "**/Sftp/SftpGlob.cs"
            tests: Sftp/SftpGlobTests.cs
          - scope: config-resolver
            mutate: -m "**/Config/SshConfigResolver.cs" -m "**/Config/SshConfigResolveOptions.cs" -m "**/Config/SshHostConfig.cs" -m "**/Config/SshDnsLookup.cs" -m "**/SshAlgorithmList.cs" -m "**/Protocol/AlgorithmNegotiator.cs"
            tests: Config/*Tests.cs;ConfigConnectTests.cs;ConfigForwardingTests.cs;AlgorithmOptionsTests.cs;PubkeyAcceptedAlgorithmsTests.cs;Protocol/KexNegotiationTests.cs;CompressionTests.cs
          # The SOCKS server of dynamic forwarding: request parsing, and the username/password check (RFC 1929).
          - scope: socks
            mutate: -m "**/Protocol/SocksHandshake.cs"
            tests: SocksHandshakeTests.cs;SocksProxyTests.cs;SocksAuthenticationTests.cs;RemoteDynamicForwardingTests.cs
          - scope: config-known-hosts
            mutate: -m "**/Config/KnownHosts*.cs" -m "**/Config/ForwardSpec.cs" -m "**/Config/SshExecMatcher.cs" -m "**/Config/SshTime.cs"
            tests: Config/*Tests.cs;KnownHostsVerifierTests.cs;ConfigForwardingTests.cs;Fuzz/ParserRobustnessTests.cs;Keys/SshPublicKeyTests.cs
          # The replies to the SFTP file hash extensions (check-file, md5-hash) and raw extended requests, and check-file announcements.
          - scope: sftp-extension-replies
            mutate: -m "**/Sftp/SftpExtensionReplies.cs"
            tests: Sftp/SftpExtensionRepliesTests.cs;Sftp/SftpFileHashTests.cs;Fuzz/ParserRobustnessTests.cs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history
      - uses: ./.github/actions/setup-dotnet
        with:
          dotnet-8: false
      - run: dotnet tool restore
      - name: Stryker
        working-directory: tests/SshSharp.Tests
        # MTP is Stryker's runner for Microsoft.Testing.Platform, which TUnit is built on (a preview runner in Stryker.NET 5).
        # stryker-config.json, found in this directory, leaves ConfigureAwait's argument unmutated: library code has no synchronization
        # context to return to, so true and false behave the same and every such mutant would survive.
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          # Only this scope's tests are compiled (tests/SshSharp.Tests/SshSharp.Tests.csproj), so a mutant runs the tests that can
          # kill it: the whole suite made per-test coverage capture alone take hours.
          SSHSHARP_MUTATION_TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          since=""
          if [ "$FULL" != "true" ]; then
            base="$(git rev-list -1 --before='8 days ago' HEAD)"
            if [ -n "$base" ]; then since="--since:$base"; fi
          fi
          echo "Mode: ${since:-full}"
          dotnet stryker --test-runner mtp --project SshSharp.csproj --target-framework net10.0 $since \
            ${{ matrix.mutate }} --reporter html --reporter json --reporter progress --output "$RUNNER_TEMP/stryker" \
            | tee "$RUNNER_TEMP/stryker.log"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Mutation testing: ${{ matrix.scope }}"
            grep -E "^(Killed|Survived|Timeout|Errors):|final mutation score" "$RUNNER_TEMP/stryker.log" | sed 's/^.*INF\] //' | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-${{ matrix.scope }}
          path: ${{ runner.temp }}/stryker/reports/
          if-no-files-found: ignore
