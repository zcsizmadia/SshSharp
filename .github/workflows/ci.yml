name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR or branch makes the running workflow obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag in the comment is for humans and Dependabot).
jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history
      - uses: ./.github/actions/setup-dotnet
        with:
          build: true
      - name: Test net8.0
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net8.0 --no-build
      - name: Test net10.0 with coverage
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --results-directory TestResults
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:MarkdownSummaryGithub -assemblyfilters:"+SshSharp"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Pack (with package validation)
        if: matrix.os == 'ubuntu-latest'
        run: |
          for project in SshSharp SshSharp.FileProviders SshSharp.IO.Abstractions SshSharp.Extensions.DependencyInjection; do
            dotnet pack "src/$project" -c Release --no-build -o packages
          done
          ls packages
          echo "Packages: $(ls packages/*.nupkg | xargs -n1 basename | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: packages/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: ignore

  interop-runner:
    name: interop (OpenSSH, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history
      - name: Start OpenSSH with a throwaway account
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          echo "SSHSHARP_TEST_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "SSHSHARP_TEST_USER=sshsharp" >> "$GITHUB_ENV"
          echo "SSHSHARP_TEST_SSHD=127.0.0.1:2222" >> "$GITHUB_ENV"
          echo "SSHSHARP_TEST_SSHD_REKEY=1" >> "$GITHUB_ENV"
          sudo useradd -m -s /bin/bash sshsharp
          echo "sshsharp:$PASSWORD" | sudo chpasswd
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          # A throwaway certificate authority: it signs sshd's Ed25519 host key, and a user key that is NOT in authorized_keys.
          CERTS="$RUNNER_TEMP/certs"
          mkdir -p "$CERTS"
          ssh-keygen -q -t ed25519 -N '' -C ca -f "$CERTS/ca"
          ssh-keygen -q -t ed25519 -N '' -C certuser -f "$CERTS/user"
          ssh-keygen -q -s "$CERTS/ca" -I test-user -n sshsharp -V -5m:+2h "$CERTS/user.pub"
          sudo ssh-keygen -q -s "$CERTS/ca" -I ci-sshd -h -n 127.0.0.1,localhost -V -5m:+2h /etc/ssh/ssh_host_ed25519_key.pub
          sudo cp "$CERTS/ca.pub" /etc/ssh/sshsharp_user_ca.pub
          echo "SSHSHARP_TEST_CERTDIR=$CERTS" >> "$GITHUB_ENV"
          cat <<EOF | sudo tee /tmp/sshd_config_test
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          HostKey /etc/ssh/ssh_host_rsa_key
          HostKey /etc/ssh/ssh_host_ecdsa_key
          HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
          TrustedUserCAKeys /etc/ssh/sshsharp_user_ca.pub
          PasswordAuthentication yes
          UsePAM yes
          MaxStartups 200:30:300
          MaxSessions 64
          AllowTcpForwarding yes
          AllowStreamLocalForwarding yes
          Subsystem sftp internal-sftp
          RekeyLimit 32K
          KexAlgorithms +diffie-hellman-group-exchange-sha256,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
          LogLevel DEBUG1
          EOF
          # OpenSSH 9.8+ shuts out an address after failed or unauthenticated connections, which the tests make on purpose.
          if sudo /usr/sbin/sshd -T -f /tmp/sshd_config_test 2>/dev/null | grep -qi '^persourcepenalties '; then
            echo "PerSourcePenalties no" | sudo tee -a /tmp/sshd_config_test
          fi
          sudo /usr/sbin/sshd -t -f /tmp/sshd_config_test
          sudo /usr/sbin/sshd -f /tmp/sshd_config_test -E /tmp/sshd.log
          sleep 1
          ssh -V
      - name: Throwaway user keys from ssh-keygen (every type and file format)
        run: |
          set -euo pipefail
          KEYS="$RUNNER_TEMP/keys"
          mkdir -p "$KEYS"
          ssh-keygen -q -t ed25519 -N '' -C ed25519 -f "$KEYS/ed25519"
          ssh-keygen -q -t ecdsa -b 256 -N '' -f "$KEYS/ecdsa256"
          ssh-keygen -q -t ecdsa -b 384 -N '' -f "$KEYS/ecdsa384"
          ssh-keygen -q -t ecdsa -b 521 -N '' -f "$KEYS/ecdsa521"
          ssh-keygen -q -t rsa -b 3072 -N '' -f "$KEYS/rsa"
          ssh-keygen -q -t rsa -b 2048 -m PEM -N '' -f "$KEYS/rsa_pem"
          ssh-keygen -q -t rsa -b 2048 -m PKCS8 -N '' -f "$KEYS/rsa_pkcs8"
          ssh-keygen -q -t ecdsa -b 384 -m PEM -N '' -f "$KEYS/ecdsa_pem"
          ssh-keygen -q -t ecdsa -b 256 -m PKCS8 -N '' -f "$KEYS/ecdsa_pkcs8"
          # Passphrase-protected (bcrypt_pbkdf) with each cipher ssh-keygen offers that SshSharp reads.
          PHRASE="$(openssl rand -hex 12)"
          echo "::add-mask::$PHRASE"
          echo "SSHSHARP_TEST_KEY_PASSPHRASE=$PHRASE" >> "$GITHUB_ENV"
          for cipher in aes256-ctr aes128-ctr aes256-cbc aes256-gcm@openssh.com aes128-gcm@openssh.com; do
            ssh-keygen -q -t ed25519 -Z "$cipher" -N "$PHRASE" -f "$KEYS/ed25519_encrypted_${cipher%%@*}"
          done
          ssh-keygen -q -t rsa -b 2048 -N "$PHRASE" -f "$KEYS/rsa_encrypted_default"
          ssh-keygen -q -t ecdsa -b 384 -a 4 -N "$PHRASE" -f "$KEYS/ecdsa_encrypted_rounds4"
          # The same keys as PuTTY .ppk files, written by PuTTY's own puttygen: versions 2 and 3, plain and encrypted.
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq putty-tools > /dev/null
          puttygen --version
          printf '%s' "$PHRASE" > "$RUNNER_TEMP/phrase"
          for key in ed25519 ecdsa256 rsa; do
            puttygen "$KEYS/$key" -O private -o "$KEYS/${key}_ppk3.ppk"
            puttygen "$KEYS/$key" -O private --ppk-param version=2 -o "$KEYS/${key}_ppk2.ppk"
            puttygen "$KEYS/$key" -O private --new-passphrase "$RUNNER_TEMP/phrase" -o "$KEYS/${key}_ppk3_encrypted.ppk"
            puttygen "$KEYS/$key" -O private --ppk-param version=2 --new-passphrase "$RUNNER_TEMP/phrase" -o "$KEYS/${key}_ppk2_encrypted.ppk"
            for ppk in "$KEYS/${key}"_ppk*.ppk; do cp "$KEYS/$key.pub" "$ppk.pub"; done
          done
          rm "$RUNNER_TEMP/phrase"
          sudo install -d -m 700 -o sshsharp -g sshsharp /home/sshsharp/.ssh
          cat "$KEYS"/*.pub | sudo install -m 600 -o sshsharp -g sshsharp /dev/stdin /home/sshsharp/.ssh/authorized_keys
          echo "SSHSHARP_TEST_KEYDIR=$KEYS" >> "$GITHUB_ENV"
      - name: OpenSSH's ssh-agent holding an Ed25519 and an RSA key
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s -a "$RUNNER_TEMP/agent.sock")" > /dev/null
          ssh-add -q "$SSHSHARP_TEST_KEYDIR/ed25519" "$SSHSHARP_TEST_KEYDIR/rsa"
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSHSHARP_TEST_AGENT=1" >> "$GITHUB_ENV"
      - name: A throwaway Kerberos realm, and sshd with GSSAPIAuthentication on port 2224
        run: |
          set -euo pipefail
          sudo apt-get update -qq > /dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq krb5-kdc krb5-admin-server krb5-user > /dev/null
          cat <<EOF | sudo tee /etc/krb5.conf > /dev/null
          [libdefaults]
            default_realm = SSHSHARP.TEST
            dns_lookup_realm = false
            dns_lookup_kdc = false
            rdns = false
          [realms]
            SSHSHARP.TEST = {
              kdc = 127.0.0.1
              admin_server = 127.0.0.1
            }
          [domain_realm]
            localhost = SSHSHARP.TEST
          EOF
          MASTER="$(openssl rand -hex 16)"
          echo "::add-mask::$MASTER"
          sudo kdb5_util create -s -r SSHSHARP.TEST -P "$MASTER" > /dev/null
          # The service principal sshd accepts (host/localhost, in its keytab), and the test user's principal, whose ticket comes from a
          # keytab so no password is ever typed or echoed.
          sudo kadmin.local -q "addprinc -randkey host/localhost" > /dev/null
          sudo kadmin.local -q "ktadd -k /etc/krb5.keytab host/localhost" > /dev/null
          sudo kadmin.local -q "addprinc -randkey sshsharp" > /dev/null
          sudo kadmin.local -q "ktadd -k $RUNNER_TEMP/sshsharp.keytab sshsharp" > /dev/null
          sudo chown "$(id -u)" "$RUNNER_TEMP/sshsharp.keytab"
          sudo krb5kdc
          # krb5kdc returns before it listens: wait (at most 30 s) for port 88.
          for i in $(seq 1 30); do
            if [ -n "$(ss -Hlnut 'sport = :88')" ]; then break; fi
            sleep 1
          done
          [ -n "$(ss -Hlnut 'sport = :88')" ] || { echo "::error::the KDC is not listening on port 88"; exit 1; }
          export KRB5CCNAME="FILE:$RUNNER_TEMP/krb5cc"
          kinit -k -t "$RUNNER_TEMP/sshsharp.keytab" sshsharp
          klist
          echo "KRB5CCNAME=$KRB5CCNAME" >> "$GITHUB_ENV"
          # A second sshd on the same keys with Kerberos on; the principal sshsharp@SSHSHARP.TEST maps to the local user sshsharp.
          sed -e 's/^Port 2222$/Port 2224/' /tmp/sshd_config_test | sudo tee /tmp/sshd_config_gssapi > /dev/null
          printf 'GSSAPIAuthentication yes\nGSSAPIStrictAcceptorCheck no\n' | sudo tee -a /tmp/sshd_config_gssapi > /dev/null
          sudo /usr/sbin/sshd -t -f /tmp/sshd_config_gssapi
          sudo /usr/sbin/sshd -f /tmp/sshd_config_gssapi -E /tmp/sshd_gssapi.log
          # Wait (at most 30 s) until it answers with its banner.
          tests/docker/wait-for-ssh.sh 2224 > /dev/null || { echo "::error::the Kerberos sshd does not answer on port 2224"; exit 1; }
          echo "SSHSHARP_TEST_GSSAPI=1" >> "$GITHUB_ENV"
          echo "SSHSHARP_TEST_GSSAPI_SSHD=127.0.0.1:2224" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-dotnet
        with:
          build: true
      - name: Interop tests against the real server (net8.0)
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net8.0 --no-build --treenode-filter "/*/*/*InteropTests/*"
      - name: Interop tests against the real server (net10.0)
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build --treenode-filter "/*/*/*InteropTests/*"
      - name: Native AOT smoke test against the real server
        # Trim and AOT warnings fail the publish; the binary then connects and uses every main feature.
        run: |
          set -euo pipefail
          dotnet publish tests/SshSharp.AotSmoke -c Release -o "$RUNNER_TEMP/aot"
          "$RUNNER_TEMP/aot/SshSharp.AotSmoke"
      - name: Native AOT sample publishes
        # The sample tool must stay publishable with Native AOT (trim and AOT warnings are errors).
        run: dotnet publish samples/SshSharp.Samples.Aot -c Release -o "$RUNNER_TEMP/aot-sample"
      - name: sshd log
        if: failure()
        run: |
          sudo grep -E "rtype|global_request|Disconnect|fatal" /tmp/sshd.log | tail -n 40 || true
          sudo tail -n 80 /tmp/sshd.log
          echo "--- the Kerberos sshd ---"
          sudo grep -iE "gss|krb|kerberos|userauth|fatal" /tmp/sshd_gssapi.log | tail -n 60 || true

  # Older and other servers, each in a throwaway container: OpenSSH before strict KEX and from several eras, Dropbear and AsyncSSH.
  # Password-only: the tests that need keys, certificates or ProxyJump skip themselves here.
  interop-container:
    name: interop (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenSSH, Alpine 3.6
            image: alpine@sha256:66790a2b79e1ea3e1dabac43990c54aca5d1ddf268d9a5a0285e4167c8b24475
            server: openssh
            software: OpenSSH
            strict: '0'
          - name: OpenSSH, Alpine 3.13
            image: alpine@sha256:469b6e04ee185740477efa44ed5bdd64a07bbdd6c7e5f5d169e540889597b911
            server: openssh
            software: OpenSSH
            strict: '0'
          - name: OpenSSH, Alpine 3.19
            image: alpine@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
            server: openssh
            software: OpenSSH
            strict: '1'
          - name: OpenSSH, Alpine 3.22
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: openssh
            software: OpenSSH
            strict: '1'
          - name: Dropbear, Alpine 3.13
            image: alpine@sha256:469b6e04ee185740477efa44ed5bdd64a07bbdd6c7e5f5d169e540889597b911
            server: dropbear
            software: dropbear
            strict: '0'
          - name: Dropbear, Alpine 3.22
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: dropbear
            software: dropbear
            strict: '1'
          # An independent implementation (Python), which runs as the test account on an unprivileged port.
          - name: AsyncSSH
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: asyncssh
            software: AsyncSSH
            strict: '1'
            port: '2222'
          # Another independent implementation (Java), the server inside Jenkins, Gerrit and Eclipse (tests/docker/MinaServer.java);
          # also the test account on an unprivileged port. It identifies itself as APACHE-SSHD.
          - name: Apache MINA SSHD
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: mina
            software: APACHE-SSHD
            strict: '1'
            port: '2222'
          # Erlang/OTP ssh, known for following the RFCs strictly (tests/docker/erlang_server.escript). Its shells and commands run
          # Erlang, not a POSIX shell, so they are turned off and only the classes that need no command run: the transport (every
          # algorithm it offers), host keys, SFTP, forwarding and network faults; the tests there that need a command skip themselves.
          - name: Erlang/OTP ssh
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: erlang
            software: Erlang
            strict: '1'
            port: '2222'
            filter: /*/*/(TransportInteropTests)|(HostKeyInteropTests)|(HostKeyScanInteropTests)|(SftpInteropTests)|(ForwardingInteropTests)|(FaultInteropTests)/*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Start the server container
        env:
          IMAGE: ${{ matrix.image }}
          SERVER: ${{ matrix.server }}
          SOFTWARE: ${{ matrix.software }}
          STRICT: ${{ matrix.strict }}
          INNER_PORT: ${{ matrix.port || '22' }}
        run: tests/docker/start-server.sh "$IMAGE" "$SERVER" "$SOFTWARE" "$STRICT" "$INNER_PORT"
      - uses: ./.github/actions/setup-dotnet
        with:
          build: true
      - name: Interop tests against the container
        # Few tests at a time: Dropbear limits unauthenticated connections per address (a compile-time setting).
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build --treenode-filter "${{ matrix.filter || '/*/*/*InteropTests/*' }}" --maximum-parallel-tests 4
      - name: Server log
        if: failure()
        # Without the rekey test's per-packet lines, which would fill the tail.
        run: |
          docker logs server 2>&1 | grep -vE 'debug1: (enqueue packet|dequeue packet|ssh_set_newkeys)' | tail -n 300

  # SFTP against servers other than a plain OpenSSH: atmoz/sftp (OpenSSH in SFTP-only, chrooted mode, a popular container image)
  # and a server built on Go's pkg/sftp (the stack behind many Go-based SFTP products). Most SFTP bug reports against other .NET
  # clients are about such servers. Only the SFTP interop tests run: these servers have no shell.
  interop-sftp:
    name: interop (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: atmoz/sftp
            kind: atmoz
          - name: Go pkg/sftp
            kind: pkgsftp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.kind == 'pkgsftp'
        with:
          go-version-file: tests/sftp-servers/pkgsftp/go.mod
          cache-dependency-path: tests/sftp-servers/pkgsftp/go.sum
      - name: Start the server
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          if [ "${{ matrix.kind }}" = "atmoz" ]; then
            # User tester, chrooted to its home; only the upload directory below it is writable.
            docker run -d --name server -p 127.0.0.1:2201:22 \
              atmoz/sftp:alpine@sha256:7e439fabeae536fa254340724c042e11999924d906417dbb5c73602ad518813f "tester:$PASSWORD:1001::upload"
            SOFTWARE=OpenSSH
            DIR=upload
          else
            (cd tests/sftp-servers/pkgsftp && go build -o "$RUNNER_TEMP/pkgsftp" .)
            mkdir -p "$RUNNER_TEMP/sftp-root"
            SFTP_USER=tester SFTP_PASSWORD="$PASSWORD" nohup "$RUNNER_TEMP/pkgsftp" -listen 127.0.0.1:2201 -root "$RUNNER_TEMP/sftp-root" \
              > "$RUNNER_TEMP/server.log" 2>&1 &
            SOFTWARE=pkg/sftp
            DIR=
          fi
          BANNER="$(tests/docker/wait-for-ssh.sh 2201)" || { echo "::error::the server does not answer"; cat "$RUNNER_TEMP/server.log" || true; exit 1; }
          echo "Server: $BANNER"
          echo "Server: \`$BANNER\`" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "SSHSHARP_TEST_SSHD=127.0.0.1:2201"
            echo "SSHSHARP_TEST_USER=tester"
            echo "SSHSHARP_TEST_PASSWORD=$PASSWORD"
            echo "SSHSHARP_TEST_SERVER=$SOFTWARE"
            echo "SSHSHARP_TEST_SFTP_ONLY=1"
            echo "SSHSHARP_TEST_SFTP_DIR=$DIR"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-dotnet
        with:
          build: true
      - name: SFTP interop tests against the server
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build --treenode-filter "/*/*/SftpInteropTests/*"
      - name: Server log
        if: failure()
        run: |
          if [ "${{ matrix.kind }}" = "atmoz" ]; then docker logs server 2>&1 | tail -n 200; else tail -n 200 "$RUNNER_TEMP/server.log"; fi

  # Microsoft's OpenSSH for Windows as the server, with Git Bash as its default shell (the interop tests run POSIX commands).
  # Password-only, like the container matrix: the tests that need keys, certificates or an agent skip themselves.
  interop-windows:
    name: interop (OpenSSH for Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Start OpenSSH Server for Windows
        shell: pwsh
        run: tests/windows/start-sshd.ps1
      - name: PuTTY's Pageant, running with no keys (the test adds one)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The standalone pageant.exe of a pinned PuTTY release, checked against the SHA-256 PuTTY publishes (0.83/sha256sums).
          $pageant = "$env:RUNNER_TEMP\pageant.exe"
          Invoke-WebRequest -Uri 'https://the.earth.li/~sgtatham/putty/0.83/w64/pageant.exe' -OutFile $pageant
          $hash = (Get-FileHash $pageant -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '267d8be2912e897cd1cebe6dbde73c1e0ceb9bd865fd17817dd9debed6151de1') { throw "pageant.exe has an unexpected hash: $hash" }
          Start-Process -FilePath $pageant
          foreach ($i in 1..30) {
            if (Get-ChildItem '\\.\pipe\' | Where-Object Name -like 'pageant.*') { break }
            Start-Sleep -Seconds 1
          }
          $pipe = Get-ChildItem '\\.\pipe\' | Where-Object Name -like 'pageant.*'
          if (-not $pipe) { throw "Pageant did not create its pipe" }
          Write-Output "Pageant 0.83 is listening"
          'SSHSHARP_TEST_PAGEANT=1' >> $env:GITHUB_ENV
      - uses: ./.github/actions/setup-dotnet
        with:
          build: true
      - name: Interop tests against OpenSSH for Windows
        # Few tests at a time: under a burst of connections, OpenSSH for Windows' listener fails some accepts ("error: accept:
        # Connection reset" in its log) and leaves the connection unserved, so a test forwarding to the server's own sshd waits for an
        # identification line that never comes (#188).
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build --treenode-filter "/*/*/*InteropTests/*" --maximum-parallel-tests 4
      - name: Server log
        if: failure()
        shell: pwsh
        run: |
          $log = Get-Content "$env:ProgramData\ssh\logs\sshd.log" -ErrorAction SilentlyContinue
          "--- host key announcements and failed replies ---"
          $log | Select-String -Pattern 'hostkeys|send reply'
          "--- global requests, errors and channel opens ---"
          $log | Select-String -Pattern 'global_request|keepalive|error|fatal|channel_open|direct-tcpip|forward' | Select-Object -Last 150
          "--- channel EOF and close events ---"
          $log | Select-String -Pattern 'rcvd eof|send eof|rcvd close|send close|chan_shutdown|read<=0|obuf empty|exit-status|session_exit_message|Starting session' | Select-Object -Last 150
          "--- tail ---"
          $log | Select-Object -Last 100
          Copy-Item "$env:ProgramData\ssh\logs\sshd.log" "$env:RUNNER_TEMP\sshd.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: sshd-log-windows
          path: ${{ runner.temp }}/sshd.log
          if-no-files-found: ignore

  # ssh-audit in client mode (#218): it listens as a server, records the algorithms SshSharp offers (default options and FIPS mode),
  # and rates them. tests/ssh-audit/check_client_audit.py fails the job on any rating it does not explain, a CVE, a missing strict
  # key exchange, a default list that does not start with a post-quantum hybrid, or a non-FIPS algorithm in FIPS mode. ssh-audit's own
  # exit code is not used: it fails on its opinion of the NIST curves alone.
  audit:
    name: audit (ssh-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install ssh-audit (pinned by hash)
        run: |
          python3 -m venv "$RUNNER_TEMP/ssh-audit"
          "$RUNNER_TEMP/ssh-audit/bin/pip" install --quiet --require-hashes -r tests/ssh-audit/requirements.txt
      - uses: ./.github/actions/setup-dotnet
        with:
          build: true
      - name: Audit the client
        run: |
          set -euo pipefail
          AUDIT="$RUNNER_TEMP/ssh-audit/bin/ssh-audit"
          # One listener per mode; each takes one connection. -t is also how long it waits for the client (5 s by default).
          "$AUDIT" -t 60 -j -c -p 2300 > "$RUNNER_TEMP/default.json" & DEFAULT=$!
          "$AUDIT" -t 60 -j -c -p 2301 > "$RUNNER_TEMP/fips.json" & FIPS=$!
          for i in $(seq 1 30); do
            if [ "$(ss -ltn | grep -cE ':230[01] ')" -ge 2 ]; then break; fi
            sleep 1
          done
          SSHSHARP_TEST_SSHAUDIT=2300 SSHSHARP_TEST_SSHAUDIT_FIPS=2301 \
            dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build --treenode-filter "/*/*/SshAuditClientTests/*"
          wait "$DEFAULT" || true  # exit code 3 on the NIST curves; the reports are judged below
          wait "$FIPS" || true
          STATUS=0
          python3 tests/ssh-audit/check_client_audit.py "$RUNNER_TEMP/default.json" "default options" --post-quantum-first >> "$GITHUB_STEP_SUMMARY" || STATUS=1
          python3 tests/ssh-audit/check_client_audit.py "$RUNNER_TEMP/fips.json" "FIPS mode" --fips >> "$GITHUB_STEP_SUMMARY" || STATUS=1
          exit "$STATUS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ssh-audit-reports
          path: ${{ runner.temp }}/*.json
          if-no-files-found: ignore
