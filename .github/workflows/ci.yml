name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR or branch makes the running workflow obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag in the comment is for humans and Dependabot).
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Test net8.0
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net8.0 --no-build
      - name: Test net10.0 with coverage
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --results-directory TestResults
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:MarkdownSummaryGithub -assemblyfilters:"+SshSharp"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Pack (with package validation)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/SshSharp -c Release --no-build -o packages
          ls packages
          echo "Package: $(ls packages/*.nupkg)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: packages/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: ignore

  interop:
    name: interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
      - name: Start OpenSSH with a throwaway account
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          echo "SSHSHARP_TEST_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "SSHSHARP_TEST_USER=sshsharp" >> "$GITHUB_ENV"
          echo "SSHSHARP_TEST_SSHD=127.0.0.1:2222" >> "$GITHUB_ENV"
          echo "SSHSHARP_TEST_SSHD_REKEY=1" >> "$GITHUB_ENV"
          sudo useradd -m -s /bin/bash sshsharp
          echo "sshsharp:$PASSWORD" | sudo chpasswd
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          # A throwaway certificate authority: it signs sshd's Ed25519 host key, and a user key that is NOT in authorized_keys.
          CERTS="$RUNNER_TEMP/certs"
          mkdir -p "$CERTS"
          ssh-keygen -q -t ed25519 -N '' -C ca -f "$CERTS/ca"
          ssh-keygen -q -t ed25519 -N '' -C certuser -f "$CERTS/user"
          ssh-keygen -q -s "$CERTS/ca" -I test-user -n sshsharp -V -5m:+2h "$CERTS/user.pub"
          sudo ssh-keygen -q -s "$CERTS/ca" -I ci-sshd -h -n 127.0.0.1,localhost -V -5m:+2h /etc/ssh/ssh_host_ed25519_key.pub
          sudo cp "$CERTS/ca.pub" /etc/ssh/sshsharp_user_ca.pub
          echo "SSHSHARP_TEST_CERTDIR=$CERTS" >> "$GITHUB_ENV"
          cat <<EOF | sudo tee /tmp/sshd_config_test
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          HostKey /etc/ssh/ssh_host_rsa_key
          HostKey /etc/ssh/ssh_host_ecdsa_key
          HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
          TrustedUserCAKeys /etc/ssh/sshsharp_user_ca.pub
          PasswordAuthentication yes
          UsePAM yes
          MaxStartups 200:30:300
          MaxSessions 64
          RekeyLimit 32K
          KexAlgorithms +diffie-hellman-group14-sha256,diffie-hellman-group16-sha512
          LogLevel DEBUG1
          EOF
          # OpenSSH 9.8+ shuts out an address after failed or unauthenticated connections, which the tests make on purpose.
          if sudo /usr/sbin/sshd -T -f /tmp/sshd_config_test 2>/dev/null | grep -qi '^persourcepenalties '; then
            echo "PerSourcePenalties no" | sudo tee -a /tmp/sshd_config_test
          fi
          sudo /usr/sbin/sshd -t -f /tmp/sshd_config_test
          sudo /usr/sbin/sshd -f /tmp/sshd_config_test -E /tmp/sshd.log
          sleep 1
          ssh -V
      - name: Throwaway user keys from ssh-keygen (every type and file format)
        run: |
          set -euo pipefail
          KEYS="$RUNNER_TEMP/keys"
          mkdir -p "$KEYS"
          ssh-keygen -q -t ed25519 -N '' -C ed25519 -f "$KEYS/ed25519"
          ssh-keygen -q -t ecdsa -b 256 -N '' -f "$KEYS/ecdsa256"
          ssh-keygen -q -t ecdsa -b 384 -N '' -f "$KEYS/ecdsa384"
          ssh-keygen -q -t ecdsa -b 521 -N '' -f "$KEYS/ecdsa521"
          ssh-keygen -q -t rsa -b 3072 -N '' -f "$KEYS/rsa"
          ssh-keygen -q -t rsa -b 2048 -m PEM -N '' -f "$KEYS/rsa_pem"
          ssh-keygen -q -t rsa -b 2048 -m PKCS8 -N '' -f "$KEYS/rsa_pkcs8"
          ssh-keygen -q -t ecdsa -b 384 -m PEM -N '' -f "$KEYS/ecdsa_pem"
          ssh-keygen -q -t ecdsa -b 256 -m PKCS8 -N '' -f "$KEYS/ecdsa_pkcs8"
          # Passphrase-protected (bcrypt_pbkdf) with each cipher ssh-keygen offers that SshSharp reads.
          PHRASE="$(openssl rand -hex 12)"
          echo "::add-mask::$PHRASE"
          echo "SSHSHARP_TEST_KEY_PASSPHRASE=$PHRASE" >> "$GITHUB_ENV"
          for cipher in aes256-ctr aes128-ctr aes256-cbc aes256-gcm@openssh.com aes128-gcm@openssh.com; do
            ssh-keygen -q -t ed25519 -Z "$cipher" -N "$PHRASE" -f "$KEYS/ed25519_encrypted_${cipher%%@*}"
          done
          ssh-keygen -q -t rsa -b 2048 -N "$PHRASE" -f "$KEYS/rsa_encrypted_default"
          ssh-keygen -q -t ecdsa -b 384 -a 4 -N "$PHRASE" -f "$KEYS/ecdsa_encrypted_rounds4"
          # The same keys as PuTTY .ppk files, written by PuTTY's own puttygen: versions 2 and 3, plain and encrypted.
          sudo apt-get install -y -qq putty-tools > /dev/null
          puttygen --version
          printf '%s' "$PHRASE" > "$RUNNER_TEMP/phrase"
          for key in ed25519 ecdsa256 rsa; do
            puttygen "$KEYS/$key" -O private -o "$KEYS/${key}_ppk3.ppk"
            puttygen "$KEYS/$key" -O private --ppk-param version=2 -o "$KEYS/${key}_ppk2.ppk"
            puttygen "$KEYS/$key" -O private --new-passphrase "$RUNNER_TEMP/phrase" -o "$KEYS/${key}_ppk3_encrypted.ppk"
            puttygen "$KEYS/$key" -O private --ppk-param version=2 --new-passphrase "$RUNNER_TEMP/phrase" -o "$KEYS/${key}_ppk2_encrypted.ppk"
            for ppk in "$KEYS/${key}"_ppk*.ppk; do cp "$KEYS/$key.pub" "$ppk.pub"; done
          done
          rm "$RUNNER_TEMP/phrase"
          sudo install -d -m 700 -o sshsharp -g sshsharp /home/sshsharp/.ssh
          cat "$KEYS"/*.pub | sudo install -m 600 -o sshsharp -g sshsharp /dev/stdin /home/sshsharp/.ssh/authorized_keys
          echo "SSHSHARP_TEST_KEYDIR=$KEYS" >> "$GITHUB_ENV"
      - name: OpenSSH's ssh-agent holding an Ed25519 and an RSA key
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s -a "$RUNNER_TEMP/agent.sock")" > /dev/null
          ssh-add -q "$SSHSHARP_TEST_KEYDIR/ed25519" "$SSHSHARP_TEST_KEYDIR/rsa"
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSHSHARP_TEST_AGENT=1" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Interop tests against the real server (net8.0)
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net8.0 --no-build --treenode-filter "/*/*/*InteropTests/*"
      - name: Interop tests against the real server (net10.0)
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build --treenode-filter "/*/*/*InteropTests/*"
      - name: sshd log
        if: failure()
        run: |
          sudo grep -E "rtype|global_request|Disconnect|fatal" /tmp/sshd.log | tail -n 40 || true
          sudo tail -n 80 /tmp/sshd.log

  # Older and other servers, each in a throwaway container: OpenSSH before strict KEX and from several eras, and Dropbear.
  # Password-only: the tests that need keys, certificates or ProxyJump skip themselves here.
  interop-matrix:
    name: interop (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenSSH, Alpine 3.6
            image: alpine@sha256:66790a2b79e1ea3e1dabac43990c54aca5d1ddf268d9a5a0285e4167c8b24475
            server: openssh
            software: OpenSSH
            strict: '0'
          - name: OpenSSH, Alpine 3.13
            image: alpine@sha256:469b6e04ee185740477efa44ed5bdd64a07bbdd6c7e5f5d169e540889597b911
            server: openssh
            software: OpenSSH
            strict: '0'
          - name: OpenSSH, Alpine 3.19
            image: alpine@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
            server: openssh
            software: OpenSSH
            strict: '1'
          - name: OpenSSH, Alpine 3.22
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: openssh
            software: OpenSSH
            strict: '1'
          - name: Dropbear, Alpine 3.13
            image: alpine@sha256:469b6e04ee185740477efa44ed5bdd64a07bbdd6c7e5f5d169e540889597b911
            server: dropbear
            software: dropbear
            strict: '0'
          - name: Dropbear, Alpine 3.22
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: dropbear
            software: dropbear
            strict: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
      - name: Start the server container
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          docker build -q -t sshsharp-interop --build-arg BASE="${{ matrix.image }}" --build-arg SERVER="${{ matrix.server }}" tests/docker
          docker run -d --name server -p 127.0.0.1:2200:22 -e TEST_PASSWORD="$PASSWORD" sshsharp-interop
          for i in $(seq 1 30); do
            if timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2200 && head -c 64 <&3' 2>/dev/null | grep -q '^SSH-'; then break; fi
            sleep 1
          done
          BANNER="$(timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2200 && head -n 1 <&3' | tr -d '\r')"
          echo "Server: $BANNER"
          echo "Server: \`$BANNER\`" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "SSHSHARP_TEST_SSHD=127.0.0.1:2200"
            echo "SSHSHARP_TEST_USER=sshsharp"
            echo "SSHSHARP_TEST_PASSWORD=$PASSWORD"
            echo "SSHSHARP_TEST_SERVER=${{ matrix.software }}"
            echo "SSHSHARP_TEST_SERVER_STRICTKEX=${{ matrix.strict }}"
          } >> "$GITHUB_ENV"
          if [ "${{ matrix.server }}" = "openssh" ]; then echo "SSHSHARP_TEST_SSHD_REKEY=1" >> "$GITHUB_ENV"; fi
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Interop tests against the container
        # Few tests at a time: Dropbear limits unauthenticated connections per address (a compile-time setting).
        run: dotnet test --project tests/SshSharp.Tests -c Release -f net10.0 --no-build --treenode-filter "/*/*/*InteropTests/*" --maximum-parallel-tests 4
      - name: Server log
        if: failure()
        # Without the rekey test's per-packet lines, which would fill the tail.
        run: |
          docker logs server 2>&1 | grep -vE 'debug1: (enqueue packet|dequeue packet|ssh_set_newkeys)' | tail -n 300
