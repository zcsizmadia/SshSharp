name: Stress

# Runs the tests again and again, with the instrumented build (src/SshSharp/Protocol/Instrumentation.cs: double returns of pooled
# buffers, received data overwritten while queued), to catch and diagnose intermittent failures. Started by hand: each job's
# summary lists the failed tests and how often each failed, and every failing iteration's full output (plus the instrumentation
# log and, for the interop jobs, the server's log) is kept as an artifact.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Runs per job
        default: '20'
      unit-filter:
        description: TUnit tree filter for the unit test jobs (empty for every unit test, Integration and Measure left out)
        default: ''

permissions:
  contents: read

# The inputs reach the scripts as environment variables, never pasted into them.
env:
  ITERATIONS: ${{ inputs.iterations }}
  UNIT_FILTER: ${{ inputs.unit-filter }}
  # As in CI (ci.yml): the unit jobs leave out the tests that need a real server and the opt-in measurements; the interop jobs run the
  # tests that need a server, except the ssh-audit one.
  UNIT_TESTS: /*/*/*/*[(Category!=Integration)&(Category!=Measure)]
  INTEROP_TESTS: /*/*/*/*[(Category=Integration)&(Category!=SshAudit)&(Category!=Measure)]

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-dotnet
        with:
          build: true
          build-args: -p:SshSharpInstrument=true
      # As in CI: PuTTY's command-line puttygen for the .ppk interop tests, except on Windows, where puttygen.exe is a window only.
      - name: puttygen
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq > /dev/null
            sudo apt-get install -y -qq putty-tools > /dev/null
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet putty
          fi
          command -v puttygen
          puttygen --version
      - name: Loop
        shell: bash
        run: tests/stress/loop.sh "$ITERATIONS" "$RUNNER_TEMP/stress" net8.0,net10.0,net11.0 "${UNIT_FILTER:-$UNIT_TESTS}"
      - name: Summary
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/stress/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stress-unit-${{ matrix.os }}
          path: ${{ runner.temp }}/stress/
          if-no-files-found: ignore

  # The interop tests against OpenSSH, Dropbear and AsyncSSH in containers, as in CI (the fault-injection and forwarding tests among them).
  interop-container:
    name: interop (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenSSH, Alpine 3.22
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: openssh
            software: OpenSSH
            strict: '1'
          - name: Dropbear, Alpine 3.22
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: dropbear
            software: dropbear
            strict: '1'
          # Runs as the test account on an unprivileged port, as in CI.
          - name: AsyncSSH
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: asyncssh
            software: AsyncSSH
            strict: '1'
            port: '2222'
          - name: Apache MINA SSHD
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
            server: mina
            software: APACHE-SSHD
            strict: '1'
            port: '2222'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Start the server container
        env:
          IMAGE: ${{ matrix.image }}
          SERVER: ${{ matrix.server }}
          SOFTWARE: ${{ matrix.software }}
          STRICT: ${{ matrix.strict }}
          INNER_PORT: ${{ matrix.port || '22' }}
        run: tests/docker/start-server.sh "$IMAGE" "$SERVER" "$SOFTWARE" "$STRICT" "$INNER_PORT"
      - uses: ./.github/actions/setup-dotnet
        with:
          build: true
          build-args: -p:SshSharpInstrument=true
      - name: Loop
        # Few tests at a time, as in CI: Dropbear limits unauthenticated connections per address.
        run: tests/stress/loop.sh "$ITERATIONS" "$RUNNER_TEMP/stress" net10.0,net8.0 "$INTEROP_TESTS" --maximum-parallel-tests 4
      - name: Summary and server log
        if: always()
        run: |
          cat "$RUNNER_TEMP/stress/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          docker logs server > "$RUNNER_TEMP/stress/server.log" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stress-interop-${{ matrix.server }}
          path: ${{ runner.temp }}/stress/
          if-no-files-found: ignore

  # OpenSSH for Windows as in CI (password only, Git Bash as the shell, sshd at DEBUG2 for channel events).
  interop-windows:
    name: interop (OpenSSH for Windows)
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Start OpenSSH Server for Windows
        shell: pwsh
        run: tests/windows/start-sshd.ps1
      - uses: ./.github/actions/setup-dotnet
        with:
          build: true
          build-args: -p:SshSharpInstrument=true
      - name: Loop
        shell: bash
        # Few tests at a time, as in CI: OpenSSH for Windows fails some accepts under a burst of connections (#188).
        run: tests/stress/loop.sh "$ITERATIONS" "$RUNNER_TEMP/stress" net10.0,net8.0 "$INTEROP_TESTS" --maximum-parallel-tests 4
      - name: Summary and server log
        if: always()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP\stress\summary.md" -ErrorAction SilentlyContinue >> $env:GITHUB_STEP_SUMMARY
          Copy-Item "$env:ProgramData\ssh\logs\sshd.log" "$env:RUNNER_TEMP\stress\sshd.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stress-interop-windows
          path: ${{ runner.temp }}/stress/
          if-no-files-found: ignore
