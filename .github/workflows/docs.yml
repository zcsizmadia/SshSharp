name: Docs

# Builds the documentation site (guides plus the API reference generated from the XML doc comments) with DocFX. Warnings, such as
# broken links, fail the build. Release tags publish the site to GitHub Pages, so it always matches the package on nuget.org; pushes
# and pull requests only build it. A manual run can publish the site for an earlier release tag (the `ref` input).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['docs/**', 'src/**', 'dotnet-tools.json', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: The release tag (or other ref) whose docs to build and publish, for example v0.3.0
        required: true

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag in the comment is for humans and Dependabot).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet tool restore
      - run: dotnet build src/SshSharp.FileProviders -c Release # builds SshSharp too
      - run: dotnet docfx docs/docfx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/_site
      - name: Pages artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # the OIDC token deploy-pages uses
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
