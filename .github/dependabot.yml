version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # TUnit and the testing platform move together; one PR instead of several.
      testing:
        patterns: ["TUnit*", "Microsoft.Testing.*"]
  - package-ecosystem: github-actions
    # The workflows, and the composite action they share.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
