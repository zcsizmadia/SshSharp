version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # TUnit and the testing platform move together; one PR instead of several.
      testing:
        patterns: ["TUnit*", "Microsoft.Testing.*"]
    ignore:
      # The library's own dependencies stay on the lowest major that supports its oldest target (net8.0): a higher one would force
      # every net8 consumer onto it. Patch and minor updates (security fixes) still come through.
      - dependency-name: "System.IO.Pipelines"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
