name: Set up .NET
description: >-
  The SDK from global.json, the .NET 8 runtime the tests also target, and optionally the NuGet cache and a Release build of the
  solution. The repository must be checked out first, with fetch-depth 0 when the build runs (MinVer computes the version from tags
  and history).
inputs:
  dotnet-8:
    description: Also install the .NET 8 runtime (for the net8.0 tests and tools)
    default: 'true'
  cache:
    description: Cache the NuGet packages (keyed on Directory.Packages.props)
    default: 'true'
  build:
    description: Restore and build the solution in Release
    default: 'false'
  build-args:
    description: Extra arguments for dotnet build
    default: ''
runs:
  using: composite
  steps:
    # Actions are pinned by commit SHA (the tag in the comment is for humans and Dependabot).
    # On windows-11-arm, the PowerShell that runs install-dotnet.ps1 now and then crashes ("Internal CLR error. (0x80131506)", exit
    # code 0xC0000005) before our code runs (actions/setup-dotnet#793, actions/runner-images#15107). The runner-images maintainers saw
    # 11 crashes in 12,000 pwsh launches, and none with a 64 MiB gen0 budget (DOTNET_GCgen0size, in hex), so the install steps set it;
    # only these steps, so the rest of the job keeps the default GC settings. A failed install there still gets one more try. Everywhere
    # else a failure fails the job at once. Remove both once a PowerShell 7.6 release with PowerShell/PowerShell#28186 is on the image.
    - id: install
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      continue-on-error: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' }}
      env:
        DOTNET_GCgen0size: '4000000'
      with:
        global-json-file: global.json
        dotnet-version: ${{ inputs.dotnet-8 == 'true' && '8.0.x' || '' }}
        cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: '**/Directory.Packages.props'
    - if: steps.install.outcome == 'failure'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      env:
        DOTNET_GCgen0size: '4000000'
      with:
        global-json-file: global.json
        dotnet-version: ${{ inputs.dotnet-8 == 'true' && '8.0.x' || '' }}
        cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: '**/Directory.Packages.props'
    - if: inputs.build == 'true'
      shell: bash
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        dotnet restore
        dotnet build -c Release --no-restore $BUILD_ARGS
